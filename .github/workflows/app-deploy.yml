name: Application Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::192902842825:role/GitHubActions-Gatus
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t gatus-terraform .

      - name: Tag Docker image
        run: |
          docker tag gatus-terraform:latest \
          ${{ steps.login-ecr.outputs.registry }}/gatus-terraform:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/gatus-terraform:${{ github.sha }}

      - name: Show image tag
        run: echo "Image pushed with tag ${{ github.sha }}"