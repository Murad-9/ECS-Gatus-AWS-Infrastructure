name: Terraform Deploy

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

      ecr_only:
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag to deploy"
        required: true
        type: string

      ecr_only:
        description: "Only create the ECR repository"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::192902842825:role/GitHubActions-Gatus
          aws-region: eu-west-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Plan - ECR Only
        if: ${{ inputs.ecr_only }}
        working-directory: infra
        run: |
          terraform plan \
            -target=module.ecr \
            -var="image_tag=${{ inputs.image_tag }}" \
            -out=tfplan

      - name: Terraform Plan - Full Infrastructure
        if: ${{ !inputs.ecr_only }}
        working-directory: infra
        run: |
          terraform plan \
            -var="image_tag=${{ inputs.image_tag }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan