name: Deploy Gatus

on:
    push:
        branches:
            - main


permissions:
  id-token: write
  contents: read


jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
          - name: checkout code
            uses: actions/checkout@v4


          - name: configure AWS credentials
            uses: aws-actions/configure-aws-credentials@v4
            with:
                role-to-assume: arn:aws:iam::192902842825:role/GitHubActions-Gatus
                aws-region: eu-west-1


          - name: login to ECR
            id: login-ecr
            uses: aws-actions/amazon-ecr-login@v2



          - name: Build Docker image
            run: docker build -t gatus-terraform .


          - name: tag Docker image
            run: docker tag gatus-terraform:latest ${{ steps.login-ecr.outputs.registry }}/gatus-terraform:latest


          - name: Push Docker Image
            run: docker push ${{ steps.login-ecr.outputs.registry }}/gatus-terraform:latest


          - name: Deploy to ECS
            run: aws ecs update-service --cluster gatus-ecs-cluster --service gatus-ecs-service --force-new-deployment
